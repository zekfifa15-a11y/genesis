<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0e1320">
  <meta name="description" content="O livro de Gênesis em português, da primeira luz à despedida de José.">
  <title>Gênesis · Bíblia Ilustrada</title>
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="css/app.css">
  <script defer src="books/gn.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <a class="skip" href="#leitura">Pular para a leitura</a>
  <aside class="rail" aria-label="Visão geral de Gênesis">
    <div class="brand"><span class="seal" aria-hidden="true"><span></span></span><div><strong>Bíblia Ilustrada</strong><small>Nova Versão Internacional</small></div></div>
    <h1>Gênesis</h1>
    <p class="rail-caption">50 capítulos <span aria-hidden="true">·</span> 1.533 versículos</p>
    <nav id="arc-rail" class="arc-rail" aria-label="Arcos de Gênesis"></nav>
    <div class="rail-stats" id="rail-stats"></div>
  </aside>
  <div class="reader-shell">
    <header class="topbar">
      <div class="top-row">
        <button type="button" class="book-button" data-action="index"><span class="seal" aria-hidden="true"><span></span></span><span><strong>Gênesis</strong><small id="top-location">NVI</small></span></button>
        <div class="top-actions">
          <button type="button" data-action="search">Buscar</button>
          <button type="button" data-action="mode" id="change-mode" aria-label="Alternar modo de leitura">Leitura</button>
          <button type="button" data-action="settings" aria-label="Configurações de leitura">Aa</button>
        </div>
      </div>
      <div class="progress-wrap"><progress id="chapter-progress" aria-label="Progresso no capítulo" max="100" value="0"></progress></div>
    </header>
    <main class="feed" id="leitura" tabindex="0" aria-label="Leitura de Gênesis"></main>
    <aside class="card-tools" aria-label="Ações do card">
      <button type="button" data-action="favorite" aria-label="Favoritar cena" aria-pressed="false" title="Favoritar cena"><span aria-hidden="true">♡</span></button>
      <button type="button" data-action="mark" aria-label="Marcar posição" title="Marcar posição"><span aria-hidden="true">♧</span></button>
      <button type="button" data-action="annotation" aria-label="Anotação" title="Anotação"><span aria-hidden="true">✎</span></button>
      <button type="button" data-action="share" aria-label="Compartilhar versículo" title="Compartilhar versículo"><span aria-hidden="true">↗</span></button>
    </aside>
    <nav class="footbar" aria-label="Controles de leitura">
      <button type="button" data-action="previous" id="previous">Anterior</button>
      <button type="button" data-action="index" class="foot-index" id="scene-position">Capítulos</button>
      <button type="button" data-action="next" id="next">Próximo</button>
    </nav>
  </div>
  <dialog class="panel" id="panel" aria-labelledby="panel-title">
    <header class="panel-head"><h2 id="panel-title"></h2><button type="button" data-action="close" aria-label="Fechar">×</button></header>
    <div class="panel-body" id="panel-body"></div>
  </dialog>
  <div class="toast" id="toast" role="status" hidden></div>
  <noscript><p class="noscript">Ative o JavaScript para ler Gênesis e consultar as notas.</p></noscript>
</body>
</html>
